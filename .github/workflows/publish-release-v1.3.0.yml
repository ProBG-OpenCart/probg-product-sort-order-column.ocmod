name: Publish release v1.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate OpenCart installation package
        shell: bash
        run: |
          set -euo pipefail

          SOURCE='probg-product-sort-order-column.ocmod.xml'
          PACKAGE='dist/probg-product-sort-order-column-1.3.0.ocmod.zip'
          PACKAGE_NAME='probg-product-sort-order-column-1.3.0.ocmod.zip'
          WORK_DIR="$(mktemp -d)"

          cp "$SOURCE" "$WORK_DIR/install.xml"
          rm -f "$PACKAGE"
          (cd "$WORK_DIR" && zip -q "$GITHUB_WORKSPACE/$PACKAGE" install.xml)

          test "$(unzip -Z1 "$PACKAGE")" = 'install.xml'
          cmp <(unzip -p "$PACKAGE" install.xml) "$SOURCE"

          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          export SHA256
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          grep -v "  ${PACKAGE_NAME}$" dist/SHA256SUMS > dist/SHA256SUMS.tmp || true
          printf '%s  %s\n' "$SHA256" "$PACKAGE_NAME" >> dist/SHA256SUMS.tmp
          mv dist/SHA256SUMS.tmp dist/SHA256SUMS

          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ['SHA256']

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          replacements = {
              'The latest ready-to-install release package is version **1.2.0** and is available in:': 'The latest ready-to-install release package is version **1.3.0** and is available in:',
              '`dist/probg-product-sort-order-column-1.2.0.ocmod.zip`': '`dist/probg-product-sort-order-column-1.3.0.ocmod.zip`',
              '`acfa83ff6991ac3d4b4d623bb33e6f6c2b47b0603e160ac4da560b552e95f5fa`': f'`{sha}`',
              '\nVersion **1.3.0** is currently represented by the source OCMOD XML on the development branch. Its installation package should be generated when the release is prepared.\n': '\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected README.md text not found: {old}')
              text = text.replace(old, new, 1)
          changelog_line = '- fix: updated the no-results row colspan for the three additional columns.\n'
          release_line = '- chore: added the ready-to-install OpenCart 1.3.0 `.ocmod.zip` package under `dist/` and updated `SHA256SUMS`.\n'
          if release_line not in text:
              if changelog_line not in text:
                  raise SystemExit('Expected README.md 1.3.0 changelog anchor not found')
              text = text.replace(changelog_line, changelog_line + release_line, 1)
          readme.write_text(text, encoding='utf-8')

          readme_bg = Path('README_BG.md')
          text = readme_bg.read_text(encoding='utf-8')
          replacements = {
              'Последният готов инсталационен пакет е версия **1.2.0** и се намира в:': 'Последният готов инсталационен пакет е версия **1.3.0** и се намира в:',
              '`dist/probg-product-sort-order-column-1.2.0.ocmod.zip`': '`dist/probg-product-sort-order-column-1.3.0.ocmod.zip`',
              '`acfa83ff6991ac3d4b4d623bb33e6f6c2b47b0603e160ac4da560b552e95f5fa`': f'`{sha}`',
              '\nВерсия **1.3.0** в момента е налична като OCMOD XML изходен код в development branch. Инсталационният пакет трябва да бъде генериран при подготовката на релийза.\n': '\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected README_BG.md text not found: {old}')
              text = text.replace(old, new, 1)
          changelog_line = '- fix: коригиран `colspan` на реда „Няма резултати“ за трите допълнителни колони.\n'
          release_line = '- chore: добавен е готовият OpenCart 1.3.0 `.ocmod.zip` пакет в `dist/` и е обновен `SHA256SUMS`.\n'
          if release_line not in text:
              if changelog_line not in text:
                  raise SystemExit('Expected README_BG.md 1.3.0 changelog anchor not found')
              text = text.replace(changelog_line, changelog_line + release_line, 1)
          readme_bg.write_text(text, encoding='utf-8')
          PY

      - name: Commit release artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE" dist/SHA256SUMS README.md README_BG.md

          if ! git diff --cached --quiet; then
            git commit -m 'chore: prepare v1.3.0 release'
            git push origin HEAD:main
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create v1.3.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG='v1.3.0'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          cat > release-notes.md <<EOF
          ## Български

          Версия 1.3.0 разширява административния списък с продукти в OpenCart 3 с две нови сортиращи се колони:

          - ID на продукта (product.product_id) с възходящо/низходящо сортиране;
          - Дата на добавяне (product.date_added) с възходящо/низходящо сортиране;
          - добавени са български и английски заглавия на колоните;
          - коригиран е colspan на реда „Няма резултати“;
          - запазени са директната редакция на Количество и Подредба от версия 1.2.0.

          Съвместимост: OpenCart 3.0.2.0, 3.0.3.7 и 3.0.3.9.

          Инсталационен пакет: probg-product-sort-order-column-1.3.0.ocmod.zip
          SHA-256: ${SHA256}

          ## English

          Version 1.3.0 extends the OpenCart 3 admin product list with two new sortable columns:

          - Product ID (product.product_id) with ascending/descending sorting;
          - Date Added (product.date_added) with ascending/descending sorting;
          - added English and Bulgarian column labels;
          - corrected the no-results row colspan;
          - keeps the inline Quantity and Sort Order editing introduced in version 1.2.0.

          Compatibility: OpenCart 3.0.2.0, 3.0.3.7 and 3.0.3.9.

          Installation package: probg-product-sort-order-column-1.3.0.ocmod.zip
          SHA-256: ${SHA256}
          EOF

          gh release create "$TAG" "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'ProBG Product Sort Order Column 1.3.0' \
            --notes-file release-notes.md
