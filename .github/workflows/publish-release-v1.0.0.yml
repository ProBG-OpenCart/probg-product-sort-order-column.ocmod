name: Publish release v1.2.0

on:
  push:
    branches:
      - chore/publish-v1.2.0
    paths:
      - .github/workflows/publish-release-v1.0.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.2.0 tag, release and installation asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPOSITORY}"
          TARGET_SHA="22c8a5caf5ccb08d2ef3f5713d43c4e2b5898810"
          TAG="v1.2.0"
          ASSET_NAME="probg-product-sort-order-column-1.2.0.ocmod.zip"

          NOTES=$(cat <<'EOF'
          ## bg-bg

          - Добавена е директна редакция на наличното количество на продукта в **Каталог → Продукти**.
          - Количеството се записва чрез AJAX без презареждане на страницата.
          - Добавени са проверка за `modify` права, проверка за съществуване на продукта и валидация за цяло число.
          - При промяна на количество се обновяват само `quantity` и `date_modified`.
          - Обединена е JavaScript логиката за директна редакция на **Подредба** и **Количество**.
          - Запазено е стандартното сортиране по количество.
          - Съвместимост с OpenCart 3.0.2.0 и OpenCart 3.0.3.x, включително 3.0.3.9.

          ## en-gb

          - Added inline editing of product **Quantity** in **Catalog → Products**.
          - Quantity is saved through AJAX without reloading the page.
          - Added `modify` permission checks, product existence validation and signed integer validation.
          - Quantity changes update only `quantity` and `date_modified`.
          - Refactored the client-side inline editing logic so **Sort Order** and **Quantity** share the same handler.
          - Preserved the standard Quantity sorting behavior.
          - Compatible with OpenCart 3.0.2.0 and OpenCart 3.0.3.x, including 3.0.3.9.

          ### Installation package

          `probg-product-sort-order-column-1.2.0.ocmod.zip`

          SHA-256: `acfa83ff6991ac3d4b4d623bb33e6f6c2b47b0603e160ac4da560b552e95f5fa`
          EOF
          )

          if curl --silent --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/releases/tags/${TAG}" \
            -o release.json; then
            echo "Release ${TAG} already exists; reusing it."
          else
            jq -n \
              --arg tag "$TAG" \
              --arg target "$TARGET_SHA" \
              --arg name "ProBG Product Sort Order Column 1.2.0" \
              --arg body "$NOTES" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false}' \
              > release-payload.json

            curl --silent --show-error --fail-with-body \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "${API}/releases" \
              --data-binary @release-payload.json \
              > release.json
          fi

          RELEASE_ID=$(jq -r '.id' release.json)

          curl --silent --show-error --fail-with-body \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/contents/dist/${ASSET_NAME}?ref=${TARGET_SHA}" \
            -o "${ASSET_NAME}"

          EXISTING_ASSET_ID=$(curl --silent --show-error --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/releases/${RELEASE_ID}/assets" \
            | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' | head -n1)

          if [ -n "${EXISTING_ASSET_ID}" ]; then
            curl --silent --show-error --fail-with-body \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/releases/assets/${EXISTING_ASSET_ID}" \
              >/dev/null
          fi

          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" \
            --data-binary "@${ASSET_NAME}" \
            >/dev/null

          echo "Published ${TAG} from ${TARGET_SHA} with ${ASSET_NAME}."
