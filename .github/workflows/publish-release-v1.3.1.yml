name: Publish release v1.3.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release-v1.3.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate OpenCart installation package
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          SOURCE='probg-product-sort-order-column.ocmod.xml'
          PACKAGE='dist/probg-product-sort-order-column-1.3.1.ocmod.zip'
          PACKAGE_NAME='probg-product-sort-order-column-1.3.1.ocmod.zip'
          WORK_DIR="$(mktemp -d)"

          grep -q '<version>1.3.1</version>' "$SOURCE"
          cp "$SOURCE" "$WORK_DIR/install.xml"
          rm -f "$PACKAGE"
          (cd "$WORK_DIR" && zip -q "$GITHUB_WORKSPACE/$PACKAGE" install.xml)

          test "$(unzip -Z1 "$PACKAGE")" = 'install.xml'
          cmp <(unzip -p "$PACKAGE" install.xml) "$SOURCE"

          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          export SHA256
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          grep -v "  ${PACKAGE_NAME}$" dist/SHA256SUMS > dist/SHA256SUMS.tmp || true
          printf '%s  %s\n' "$SHA256" "$PACKAGE_NAME" >> dist/SHA256SUMS.tmp
          mv dist/SHA256SUMS.tmp dist/SHA256SUMS

          python3 - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ['SHA256']

          def replace_once(text, old, new, filename):
              if old not in text:
                  raise SystemExit(f'Expected text not found in {filename}: {old}')
              return text.replace(old, new, 1)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_once(text,
              'The latest ready-to-install release package is version **1.3.0** and is available in:',
              'The latest ready-to-install release package is version **1.3.1** and is available in:',
              'README.md')
          text = replace_once(text,
              '`dist/probg-product-sort-order-column-1.3.0.ocmod.zip`',
              '`dist/probg-product-sort-order-column-1.3.1.ocmod.zip`',
              'README.md')
          text = replace_once(text,
              '`d4067104d8f8cd856d638255f8f2dfd010735517c9b90ac747b20d233046d19e`',
              f'`{sha}`',
              'README.md')
          anchor = '- chore: bumped the OCMOD version to `1.3.1`.\n'
          release_line = '- chore: added the ready-to-install OpenCart 1.3.1 `.ocmod.zip` package under `dist/` and updated `SHA256SUMS`.\n'
          if release_line not in text:
              if anchor not in text:
                  raise SystemExit('Expected README.md 1.3.1 changelog anchor not found')
              text = text.replace(anchor, anchor + release_line, 1)
          readme.write_text(text, encoding='utf-8')

          readme_bg = Path('README_BG.md')
          text = readme_bg.read_text(encoding='utf-8')
          text = replace_once(text,
              'Последният готов инсталационен пакет е версия **1.3.0** и се намира в:',
              'Последният готов инсталационен пакет е версия **1.3.1** и се намира в:',
              'README_BG.md')
          text = replace_once(text,
              '`dist/probg-product-sort-order-column-1.3.0.ocmod.zip`',
              '`dist/probg-product-sort-order-column-1.3.1.ocmod.zip`',
              'README_BG.md')
          text = replace_once(text,
              '`d4067104d8f8cd856d638255f8f2dfd010735517c9b90ac747b20d233046d19e`',
              f'`{sha}`',
              'README_BG.md')
          anchor = '- chore: версията на OCMOD е увеличена на `1.3.1`.\n'
          release_line = '- chore: добавен е готовият OpenCart 1.3.1 `.ocmod.zip` пакет в `dist/` и е обновен `SHA256SUMS`.\n'
          if release_line not in text:
              if anchor not in text:
                  raise SystemExit('Expected README_BG.md 1.3.1 changelog anchor not found')
              text = text.replace(anchor, anchor + release_line, 1)
          readme_bg.write_text(text, encoding='utf-8')
          PY

      - name: Commit release artifacts
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PACKAGE" dist/SHA256SUMS README.md README_BG.md

          if ! git diff --cached --quiet; then
            git commit -m 'chore: prepare v1.3.1 release'
            git push origin HEAD:main
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create v1.3.1 tag and GitHub release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## Български

          Версия 1.3.1 коригира разместването на колоните в административния списък с продукти при наличие на други OCMOD модификации на клетката със заглавието на продукта.

          - колоната „ID на продукта“ вече се закача спрямо колоната „Изображение“;
          - стойността на Product ID във всеки ред също се добавя непосредствено след изображението;
          - премахната е зависимостта от точния markup на клетката с името на продукта;
          - запазено е сортирането по Product ID и Date Added от версия 1.3.0.

          Съвместимост: OpenCart 3.0.2.0, 3.0.3.7 и 3.0.3.9.

          Инсталационен пакет: probg-product-sort-order-column-1.3.1.ocmod.zip
          SHA-256: ${SHA256}

          ## English

          Version 1.3.1 fixes product-list column misalignment when another OCMOD/customization changes the product-title cell.

          - the Product ID header is now anchored to the Image column;
          - the Product ID row value is also inserted directly after the product image;
          - the modification no longer depends on the exact product-name cell markup;
          - Product ID and Date Added sorting from version 1.3.0 remains unchanged.

          Compatibility: OpenCart 3.0.2.0, 3.0.3.7 and 3.0.3.9.

          Installation package: probg-product-sort-order-column-1.3.1.ocmod.zip
          SHA-256: ${SHA256}
          EOF

          gh release create v1.3.1 "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'ProBG Product Sort Order Column 1.3.1' \
            --notes-file release-notes.md
